<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho | Papelaria Cristã</title>
  <meta name="description" content="Seu carrinho de compras na Papelaria Cristã.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7e5bb3">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/cart-page.js"></script>
</head>
<body data-page="carrinho">
  <main id="conteudo" class="container">
    <div class="pagina-topo">
      <nav class="migalhas" aria-label="Você está em">
        <ol><li><a href="index.html">Início</a></li><li aria-current="page">Carrinho</li></ol>
      </nav>
      <h1>Seu carrinho</h1>
    </div>

    <div id="avisos" aria-live="polite"></div>

    <div class="carrinho" id="carrinho">
      <section aria-label="Itens do carrinho">
        <ul class="cart-lista" id="itens"><li class="esqueleto"></li></ul>
      </section>

      <aside class="resumo" id="resumo" aria-labelledby="resumo-titulo" hidden>
        <h2 id="resumo-titulo">Resumo do pedido</h2>
        <div class="resumo__linha"><span>Itens</span><span id="r-itens">0</span></div>
        <div class="resumo__linha"><span>Subtotal</span><span id="r-subtotal">R$ 0,00</span></div>
        <div class="resumo__linha" id="r-economia-linha" hidden><span>Você economiza</span><span id="r-economia"></span></div>
        <div class="resumo__total"><span>Total</span><strong id="r-total">R$ 0,00</strong></div>
        <p class="dica"><small>Frete e forma de pagamento são combinados com a loja na finalização.</small></p>

        <form id="checkout" novalidate>
          <h3>Finalizar pedido</h3>
          <div class="campo">
            <label for="c-nome">Seu nome</label>
            <input id="c-nome" name="customer_name" autocomplete="name" maxlength="80" required>
            <span class="erro" data-erro="customer_name"></span>
          </div>
          <div class="campo">
            <label for="c-tel">WhatsApp / telefone</label>
            <input id="c-tel" name="customer_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" maxlength="16" required>
            <span class="erro" data-erro="customer_phone"></span>
          </div>
          <div class="campo">
            <label for="c-obs">Observações <span class="dica">(opcional)</span></label>
            <textarea id="c-obs" name="notes" maxlength="500" placeholder="Ex.: é para presente, bairro para entrega…"></textarea>
            <span class="erro" data-erro="notes"></span>
          </div>
          <span class="erro" data-erro="items" role="alert"></span>
          <button class="btn btn--whats btn--bloco" type="submit" id="finalizar">Finalizar pedido</button>
        </form>
      </aside>
    </div>

    <section id="sucesso" class="cartao" hidden aria-live="polite"></section>
  </main>
</body>
</html>
