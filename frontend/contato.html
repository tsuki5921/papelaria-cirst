<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Papelaria Cristã</title>
  <meta name="description" content="Fale com a Papelaria Cristã: WhatsApp, telefone, endereço e redes sociais.">
  <meta property="og:title" content="Contato | Papelaria Cristã">
  <meta property="og:description" content="Fale com a Papelaria Cristã: WhatsApp, telefone, endereço e redes sociais.">
  <meta name="theme-color" content="#7e5bb3">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/contact.js"></script>
</head>
<body data-page="contato">
  <main id="conteudo" class="container">
    <div class="pagina-topo">
      <nav class="migalhas" aria-label="Você está em">
        <ol><li><a href="index.html">Início</a></li><li aria-current="page">Contato</li></ol>
      </nav>
      <h1>Fale conosco</h1>
      <p class="hero__texto">Tire dúvidas, peça indicações de presentes ou acompanhe seu pedido. Será uma alegria atender você.</p>
    </div>
    <div class="contato-grid">
      <section aria-labelledby="canais-titulo">
        <h2 class="secao__titulo" id="canais-titulo">Nossos canais</h2>
        <div class="contato-cards" id="canais"><div class="esqueleto"></div></div>
      </section>
      <section class="cartao" aria-labelledby="form-titulo" id="bloco-form" hidden>
        <h2 id="form-titulo">Envie uma mensagem</h2>
        <form id="form-contato" novalidate>
          <div class="campo">
            <label for="ct-nome">Nome</label>
            <input id="ct-nome" name="nome" autocomplete="name" maxlength="80" required>
            <span class="erro" data-erro="nome"></span>
          </div>
          <div class="campo">
            <label for="ct-assunto">Assunto</label>
            <select id="ct-assunto" name="assunto">
              <option>Dúvida sobre produto</option>
              <option>Acompanhar pedido</option>
              <option>Indicação de presente</option>
              <option>Outro assunto</option>
            </select>
          </div>
          <div class="campo">
            <label for="ct-msg">Mensagem</label>
            <textarea id="ct-msg" name="mensagem" maxlength="1000" required></textarea>
            <span class="erro" data-erro="mensagem"></span>
          </div>
          <button class="btn btn--bloco" type="submit" id="ct-enviar">Enviar mensagem</button>
          <p class="dica" id="ct-dica"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
